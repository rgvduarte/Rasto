name: Deploy GitHub Pages

on:
  push:
    branches: [main, claude/jolly-carson-qogryc]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
      # Pushes feitos com o GITHUB_TOKEN não disparam a publicação do Pages: pede-se explicitamente.
      - name: Pedir a publicação do Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pages --jq '{url: .html_url, source: .source, status: .status}' || true
          gh api -X POST repos/${{ github.repository }}/pages/builds
          sleep 20
          gh api repos/${{ github.repository }}/pages/builds/latest --jq '{status: .status, error: .error.message, commit: .commit}' || true
